{{ define "main" }}
  {{- $m := int (.Params.moves | default 0) -}}
  {{- $anchor := cond (le $m 10) "10-moves" (cond (le $m 15) "1015-moves" (cond (le $m 20) "1520-moves" (cond (le $m 30) "2130-moves" "over-30"))) -}}
  <main class="content page-template page-{{ .Slug }}">
    <article class="post page">
      <header class="post-header">
        <a id="back-to-main-page" href="{{ site.Home.RelPermalink }}{{ if .Params.moves }}#{{ $anchor }}{{ end }}"><i class="fa fa-chevron-left" aria-hidden="true"></i> All games</a>
      </header>
      <h1 class="post-title">{{ .Title }}</h1>
      <section class="post-content">
        {{ .Content }}
      </section>
    </article>
  </main>
{{ end }}
